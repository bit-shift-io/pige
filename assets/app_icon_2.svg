<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3035" />
      <stop offset="100%" stop-color="#181A1C" />
    </linearGradient>

    <!-- Vibrant main circular gradient (Blue to Cyan/Teal) -->
    <linearGradient id="circleGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#1A56DB" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Origami facet color gradients matching the reference white origami -->
    <linearGradient id="wingTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="wingBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090D16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" />

  <!-- Vibrant Inner Circle -->
  <circle cx="256" cy="256" r="172" fill="url(#circleGrad)" />

  <!-- Origami Bird Group -->
  <g filter="url(#shadow)">
    <!-- 1. Back/upper-left folded wing flap -->
    <polygon points="212,242 128,172 195,182" fill="url(#wingBack)" />
    <polygon points="212,242 195,182 238,205" fill="#A4B3C6" />

    <!-- 2. Tail section pointing bottom-left -->
    <polygon points="212,242 135,310 198,285" fill="#FFFFFF" />
    <polygon points="212,242 198,285 208,312" fill="#CBD5E1" />
    <polygon points="135,310 170,285 198,285" fill="#E2E8F0" />

    <!-- 3. Central body / chest facet -->
    <polygon points="212,242 208,312 282,265" fill="#E2E8F0" />
    <polygon points="212,242 282,265 262,185" fill="#FFFFFF" />

    <!-- 4. Large front-facing origami wing -->
    <polygon points="212,242 152,145 225,215" fill="url(#wingTop)" />
    <polygon points="225,215 152,145 262,185" fill="#F1F5F9" />

    <!-- 5. Head and neck area -->
    <polygon points="262,185 282,265 315,185" fill="#FFFFFF" />

    <!-- 6. Beak -->
    <polygon points="315,185 328,191 315,200" fill="#F59E0B" />

    <!-- 7. Eye -->
    <circle cx="301" cy="189" r="2.2" fill="#0F172A" />

    <!-- 8. Letter / Envelope in beak -->
    <g transform="translate(322, 170) rotate(22)">
      <!-- Envelope base -->
      <rect x="0" y="0" width="54" height="36" rx="2.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
      <!-- Flap lines -->
      <polyline points="0,0 27,19 54,0" fill="none" stroke="#94A3B8" stroke-width="1.2" />
      <polyline points="0,36 18,18" fill="none" stroke="#E2E8F0" stroke-width="1" />
      <polyline points="54,36 36,18" fill="none" stroke="#E2E8F0" stroke-width="1" />
      
      <!-- Stamp -->
      <rect x="41" y="4" width="9" height="11" fill="#F59E0B" rx="1" />

      <!-- Envelope badge (Blue circle with white 'p') -->
      <circle cx="27" cy="21" r="7.5" fill="#2563EB" />
      <path d="M 27 16.5 C 24.8 16.5 23.5 17.8 23.5 19.8 L 23.5 25.5 L 25.5 25.5 L 25.5 22.2 C 25.8 22.4 26.3 22.5 26.8 22.5 C 28.8 22.5 30.2 21.2 30.2 19.5 C 30.2 17.8 28.8 16.5 27 16.5 Z M 27 21 C 26 21 25.2 20.3 25.2 19.5 C 25.2 18.7 26 18 27 18 C 28 18 28.5 18.7 28.5 19.5 C 28.5 20.3 28 21 27 21 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: 'pige' -->
  <text x="256" y="386" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="52" font-weight="500" letter-spacing="-0.3" text-anchor="middle">pige</text>
</svg>
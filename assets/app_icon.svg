<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3035" />
      <stop offset="100%" stop-color="#181A1C" />
    </linearGradient>

    <!-- Vibrant main circular gradient -->
    <linearGradient id="circleGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1E52ED" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Shading gradients for origami facets -->
    <linearGradient id="facetBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Drop shadow for the bird -->
    <filter id="birdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Dark App Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" />

  <!-- Vibrant Gradient Circle -->
  <circle cx="256" cy="256" r="170" fill="url(#circleGrad)" />

  <!-- Origami Bird & Envelope Group -->
  <g filter="url(#birdShadow)">
    <!-- Back Wing -->
    <polygon points="215,255 130,175 205,178" fill="url(#facetDark)" />
    <polygon points="215,255 205,178 248,208" fill="#818CF8" opacity="0.25" />

    <!-- Tail Section -->
    <polygon points="215,255 140,312 200,292" fill="url(#facetMid)" />
    <polygon points="215,255 200,292 208,318" fill="url(#facetDark)" />

    <!-- Main Front Wing -->
    <polygon points="215,255 155,148 225,225" fill="url(#facetBright)" />
    <polygon points="225,225 155,148 268,185" fill="url(#facetMid)" />

    <!-- Body / Belly -->
    <polygon points="215,255 208,318 288,272" fill="url(#facetMid)" />
    <polygon points="215,255 288,272 268,185" fill="url(#facetBright)" />

    <!-- Head & Neck -->
    <polygon points="268,185 288,272 318,182" fill="url(#facetBright)" />
    
    <!-- Beak & Eye -->
    <polygon points="318,182 330,188 318,196" fill="#F59E0B" />
    <circle cx="304" cy="186" r="2.5" fill="#0F172A" />

    <!-- Envelope -->
    <g transform="translate(324, 168) rotate(22)">
      <rect x="0" y="0" width="56" height="38" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <polyline points="0,0 28,21 56,0" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
      <polyline points="0,38 20,20" fill="none" stroke="#F1F5F9" stroke-width="1.2" />
      <polyline points="56,38 36,20" fill="none" stroke="#F1F5F9" stroke-width="1.2" />
      
      <rect x="42" y="4" width="10" height="12" fill="#F59E0B" rx="1" />
      <path d="M42,4 L52,4 L52,16 L42,16 Z" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,2" fill="none" />

      <circle cx="28" cy="23" r="8" fill="#2563EB" />
      <path d="M 28 18 A 5 5 0 1 0 28 28 A 5 5 0 0 0 28 18 M 28 21 A 2 2 0 1 1 28 25 A 2 2 0 0 1 28 21" fill="#FFFFFF" fill-rule="evenodd" />
      <polygon points="23,26 21,29 25,27" fill="#2563EB" />
    </g>
  </g>

  <!-- Typography -->
  <text x="256" y="388" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="54" font-weight="500" letter-spacing="-0.5" text-anchor="middle">pige</text>
</svg>
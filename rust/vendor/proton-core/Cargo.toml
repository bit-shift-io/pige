[package]
edition = "2021"
rust-version = "1.96"
name = "proton-core"
version = "0.1.2"
license = "MIT"
description = "Disposable S3 extraction probe: proton-core with cache/keyring/persistence removed."

[lib]
name = "proton_core"
path = "src/lib.rs"

[dependencies.ammonia]
version = "4"

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.chrono]
version = "0.4"

[dependencies.futures]
version = "0.3"

[dependencies.mail-builder]
version = "0.4"

[dependencies.mail-parser]
version = "0.11"

[dependencies.proton-crypto]
version = "0.14.1"
features = ["rustpgp"]
default-features = false

[dependencies.proton-srp]
version = "0.8"

[dependencies.reqwest]
version = "0.13"
features = [
    "json",
    "cookies",
    "rustls",
    "multipart",
]
default-features = false

[dependencies.secrecy]
version = "0.10"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tracing]
version = "0.1"

[dependencies.urlencoding]
version = "2"

[dependencies.zeroize]
version = "1"

[dev-dependencies.wiremock]
version = "0.6"

[package]
name = "pige_core"
version.workspace = true
edition = "2024"

[dependencies]
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
base64 = "0.23"
futures = "0.3"
html5ever = "0.39"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
log = "0.4"
mail-parser = "1"
markup5ever_rcdom = "0.39"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Downloads folder resolution for configuration backups (`dirs::download_dir`).
dirs = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"

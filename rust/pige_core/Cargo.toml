[package]
name = "pige_core"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
mail-parser = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

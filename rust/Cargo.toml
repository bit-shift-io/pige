# Workspace layout adapted from qlaunch (bitshift, MIT): same resolver, the
# `android-activity` patch and release `strip` so the Android shell builds
# identically to the launcher it was derived from.
[workspace]
resolver = "2"
members = ["pige_core", "pige"]
# The vendored Proton library is a path dependency of `pige_core` only when
# `provider-proton` is enabled. Excluding it keeps it out of the default
# workspace build and out of the shared package version/lints.
exclude = ["vendor/proton-core"]

[workspace.package]
version = "2026.11.5"

[patch.crates-io]
android-activity = { git = "https://github.com/Santuzius/android-activity", tag = "iced_android-v0.1.1" }

[profile.release]
strip = "debuginfo"

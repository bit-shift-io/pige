[package]
name = "pige"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pige"
path = "src/main.rs"

[features]
default = []
provider-google = ["pige_core/provider-google"]
provider-proton = ["pige_core/provider-proton"]

[dependencies]
pige_core = { path = "../pige_core" }
serde_json = "1"
url = "2"
# Iced is pinned exactly as qlaunch does (bitshift, MIT), including the
# `iced_android` fork that drives the Android surface. Android inherits
# premultiplied surface alpha, so keep iced's default web-colors blend space.
iced = { git = "https://github.com/Santuzius/iced", tag = "iced_android-v0.1.1", default-features = false, features = ["wgpu", "tokio", "image", "wayland", "advanced", "web-colors", "canvas"] }
iced_android = { git = "https://github.com/Santuzius/iced_android", tag = "v0.1.1" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
futures = { version = "0.3", features = ["executor"] }
log = "0.4"
# One logging pipeline for both platforms: the subscriber captures this
# crate's `log` records and the vendored Proton transport's `tracing` events
# (wire request/status/timing). Desktop writes stdout; Android writes logcat
# (see `logging.rs`). `RUST_LOG` selects the verbosity where a shell can set it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop window icon decoding. PNG-only; the crate is already in the tree
# through iced's `image` feature, so this adds no new build cost.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "android")'.dependencies]
# Raw logcat bindings for the unified logger's Android writer.
android_log-sys = "0.3"
jni = "0.21"
